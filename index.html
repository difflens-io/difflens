<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DiffLens is a local-first structured text diff tool for JSON, JSONL, cURL, Cookie, HTTP Request, TOML, Markdown, CSV, YAML, XML, Properties, and plain text."
    />
    <meta
      name="keywords"
      content="diff, json diff, jsonl diff, ndjson diff, curl diff, cookie diff, http request diff, toml diff, markdown diff, local diff, structured diff"
    />
    <meta name="application-name" content="DiffLens" />
    <meta name="theme-color" content="#155e75" />
    <link rel="canonical" href="https://www.difflens.io/" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DiffLens" />
    <meta property="og:title" content="DiffLens - Local-first structured text diff" />
    <meta
      property="og:description"
      content="Compare JSON, JSONL, cURL, Cookie, HTTP Request, TOML, Markdown, CSV, YAML, XML, and plain text locally in your browser."
    />
    <meta property="og:url" content="https://www.difflens.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DiffLens - Local-first structured text diff" />
    <meta
      name="twitter:description"
      content="Compare JSONL and other structured developer text locally in your browser without uploading comparison content."
    />
    <title>DiffLens - Local-first structured text diff</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DiffLens",
        "url": "https://www.difflens.io/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "Local-first structured text diff for JSON, JSONL, cURL, Cookie, HTTP Request, TOML, Markdown, CSV, YAML, XML, Properties, and plain text.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "softwareHelp": "https://github.com/difflens-io/difflens"
      }
    </script>
    <script>
      (function () {
        var measurementId = '%VITE_GA_MEASUREMENT_ID%';
        var analyticsHosts = '%VITE_ANALYTICS_HOSTS%';
        var configured = measurementId && measurementId.indexOf('%VITE_') !== 0;
        if (!configured) return;

        var trackedHosts = analyticsHosts && analyticsHosts.indexOf('%VITE_') !== 0
          ? analyticsHosts.split(',').map(function (host) { return host.trim(); }).filter(Boolean)
          : [];
        if (trackedHosts.length > 0 && trackedHosts.indexOf(window.location.hostname) === -1) return;

        window.__difflensAnalytics = {
          gaBootstrapped: true,
          gaScriptStatus: 'pending',
          host: window.location.hostname
        };
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag('js', new Date());
        window.gtag('config', measurementId, new URLSearchParams(window.location.search).has('ga_debug')
          ? { debug_mode: true }
          : {});

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
        script.onload = function () {
          window.__difflensAnalytics.gaScriptStatus = 'loaded';
        };
        script.onerror = function () {
          window.__difflensAnalytics.gaScriptStatus = 'failed';
        };
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
